<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your sign-in code</title></head>
  <body style="margin:0;padding:32px 16px;background:#171512;color:#f5eee5;font-family:Arial,sans-serif;">
    <table role="presentation" style="width:100%;max-width:480px;margin:0 auto;background:#211e19;border:1px solid #494136;border-radius:16px;">
      <tr><td style="padding:32px;">
        <h1 style="margin:0 0 24px;font-family:Georgia,serif;font-size:28px;">Someone's Houston</h1>
        <p style="font-size:16px;line-height:1.6;">Enter this code in the app to continue:</p>
        <p style="margin:24px 0;color:#f4a36c;font-size:32px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
        <p style="font-size:14px;line-height:1.6;color:#d3c8b9;">This code is for one-time use. If it expires, request a new code in the app.</p>
        <p style="font-size:14px;line-height:1.6;color:#d3c8b9;">If you didn't request this code, you can ignore this email. Don't share the code with anyone.</p>
      </td></tr>
    </table>
  </body>
</html>
